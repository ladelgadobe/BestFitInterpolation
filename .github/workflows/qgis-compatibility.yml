name: QGIS compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      matrix:
        description: Compatibility matrix
        type: choice
        default: full
        options: [fast, full]
      nightly:
        description: Include the informational official nightly
        type: boolean
        default: false
  release:
    types: [published]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: qgis-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python ci/static_check.py
      - run: python -m unittest discover -s tests/compatibility -p test_ci_policy.py -v
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'release' && 'full' || contains(github.event.head_commit.message, '[compatibility full]') && 'full' || inputs.matrix || 'fast' }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly || false }}
        run: |
          extra=()
          if [ "$NIGHTLY" = 'true' ]; then extra+=(--nightly); fi
          python ci/resolve_images.py --mode "$MODE" --github-output "$GITHUB_OUTPUT" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-discovery
          path: compatibility-results/

  runtime:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore cached official image and scientific layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/bfi-build-cache
          key: qgis-${{ matrix.requested }}-${{ matrix.resolution.digest }}-${{ hashFiles('docker/compatibility.Dockerfile') }}
      - name: Configure Docker Buildx
        run: docker buildx create --driver docker-container --use
      - name: Run the shared local and CI entry point
        env:
          TARGET: ${{ matrix.requested }}
          TARGET_JSON: ${{ toJSON(matrix) }}
          BFI_DOCKER_CACHE: /tmp/bfi-build-cache
        run: |
          mkdir -p compatibility-results
          python -c "import json,os,pathlib;pathlib.Path('compatibility-results/discovery.json').write_text(json.dumps({'targets':[json.loads(os.environ['TARGET_JSON'])]}))"
          python scripts/test_qgis_version.py "$TARGET"
      - name: Preserve new cached layers
        if: always()
        run: |
          if [ -d /tmp/bfi-build-cache-new ]; then
            rm -rf /tmp/bfi-build-cache
            mv /tmp/bfi-build-cache-new /tmp/bfi-build-cache
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-runtime-${{ matrix.requested }}
          path: compatibility-results/
          retention-days: 30

  qgis4-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 ci/run_qgis4_checker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pyqgis4-checker
          path: compatibility-results/checker/

  compatibility-gate:
    needs: [discover, runtime, qgis4-checker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require successful prerequisite jobs
        env:
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          CHECKER_RESULT: ${{ needs.qgis4-checker.result }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$CHECKER_RESULT" = success
      - name: Download evidence with the GitHub API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$REPOSITORY" --dir compatibility-results/evidence
      - name: Generate summary and enforce required coverage
        if: always()
        run: python3 ci/summarize.py --discovery compatibility-results/evidence/compatibility-discovery/discovery.json
      - name: Enforce checker review
        if: always()
        run: python3 ci/review_checker.py compatibility-results/evidence/pyqgis4-checker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qgis-compatibility-report
          path: |
            compatibility-results/qgis_compatibility_report.*
