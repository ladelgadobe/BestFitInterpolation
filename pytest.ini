[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    qgis: requires a real QGIS Python interpreter (qgis.core importable). Skipped in headless unit runs.
    gui: builds Qt widgets; needs an (offscreen) display.
    slow: long-running test. Deselect with -m "not slow".
